name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['mobile/**', 'scripts/prepare_android.py', 'scripts/configure_signing.py', 'scripts/verify_apk_signing.py', 'infra/keys/android-signing.*', 'infra/gradle-mirror.init.gradle', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'scripts/prepare_android.py', 'scripts/configure_signing.py', 'scripts/verify_apk_signing.py', 'infra/keys/android-signing.*', 'infra/gradle-mirror.init.gradle', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      demo_mode:
        description: Build with clearly labelled offline demo data
        type: boolean
        default: false
      api_base_url:
        description: HTTPS backend URL when demo_mode is false
        type: string
        default: 'https://v4.yukifn.xyz:7010'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEMO_MODE: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'workflow_dispatch' && inputs.demo_mode && 'true' || 'false' }}
      API_BASE_URL: ${{ inputs.api_base_url || 'https://v4.yukifn.xyz:7010' }}
      CAMPUS_SIGNING_REQUIRED: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Generate pinned Flutter Android platform
        run: |
          flutter create --no-pub --platforms=android --project-name=campus_assistant --org=com.muyuan "$RUNNER_TEMP/android_template"
          cp -R "$RUNNER_TEMP/android_template/android" mobile/android
          python3 scripts/prepare_android.py
      - name: Configure fixed release signing
        if: github.event_name != 'pull_request'
        env:
          CKIA_CI_BUNDLE: ${{ secrets.CKIA_CI_BUNDLE }}
        run: python3 scripts/configure_signing.py
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Configure Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp infra/gradle-mirror.init.gradle "$HOME/.gradle/init.d/campus-mirror.gradle"
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test native app
        env:
          UI_PREVIEW_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        working-directory: mobile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          flutter test
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews-${{ github.run_number }}
          path: artifacts/ui-preview/
          if-no-files-found: error
      - name: Build installable APK
        working-directory: mobile
        run: |
          if [ "$DEMO_MODE" = "false" ] && [[ "$API_BASE_URL" != https://* ]]; then
            echo 'Live mode requires an HTTPS API_BASE_URL.'
            exit 1
          fi
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define="DEMO_MODE=$DEMO_MODE" --dart-define="API_BASE_URL=$API_BASE_URL"
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/campus-assistant.apk
          if [ "$CAMPUS_SIGNING_REQUIRED" = true ]; then
            APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
            "$APK_SIGNER" verify --verbose --print-certs ../artifacts/campus-assistant.apk > ../artifacts/APK-SIGNATURE.txt
            python3 ../scripts/verify_apk_signing.py ../artifacts/APK-SIGNATURE.txt ../infra/keys/android-signing.sha256
          fi
          cd ../artifacts
          sha256sum campus-assistant.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-assistant-android-${{ github.run_number }}
          path: |
            artifacts/campus-assistant.apk
            artifacts/SHA256SUMS.txt
            artifacts/APK-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        run: |
          echo '### Android APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the campus-assistant-android artifact below and extract campus-assistant.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo "Fixed release signing required: $CAMPUS_SIGNING_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "Offline demo mode: $DEMO_MODE" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: campus-assistant-android-${{ github.run_number }}
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' mobile/pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" artifacts/campus-assistant.apk artifacts/SHA256SUMS.txt artifacts/APK-SIGNATURE.txt --verify-tag --title "校园万事通 $GITHUB_REF_NAME" --notes-file .github/release-notes.md
