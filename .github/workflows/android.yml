name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'scripts/prepare_android.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'scripts/prepare_android.py', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      demo_mode:
        description: Build with clearly labelled offline demo data
        type: boolean
        default: true
      api_base_url:
        description: HTTPS backend URL when demo_mode is false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEMO_MODE: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.demo_mode && 'true' || 'false' }}
      API_BASE_URL: ${{ inputs.api_base_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Generate pinned Flutter Android platform
        run: |
          flutter create --no-pub --platforms=android --project-name=campus_assistant --org=com.muyuan "$RUNNER_TEMP/android_template"
          cp -R "$RUNNER_TEMP/android_template/android" mobile/android
          python3 scripts/prepare_android.py
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test native app
        working-directory: mobile
        run: flutter test
      - name: Build installable APK
        working-directory: mobile
        run: |
          if [ "$DEMO_MODE" = "false" ] && [[ "$API_BASE_URL" != https://* ]]; then
            echo 'Live mode requires an HTTPS API_BASE_URL.'
            exit 1
          fi
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define="DEMO_MODE=$DEMO_MODE" --dart-define="API_BASE_URL=$API_BASE_URL"
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/campus-assistant.apk
          cd ../artifacts
          sha256sum campus-assistant.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-assistant-android-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        run: |
          echo '### Android APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the campus-assistant-android artifact below and extract campus-assistant.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This preview APK uses Flutter template development signing. Demo data is clearly labelled in the app.' >> "$GITHUB_STEP_SUMMARY"
