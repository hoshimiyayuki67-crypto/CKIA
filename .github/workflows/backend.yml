name: Backend container

on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'infra/**', '.dockerignore', 'scripts/check-backend-deployment.py', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'web/**', 'infra/**', '.dockerignore', 'scripts/check-backend-deployment.py', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements-dev.lock.txt
          python -m pip install --no-deps -e backend
          python -m pytest backend/tests -q
      - name: Validate HTTPS Compose configuration
        env:
          CAMPUS_DOMAIN: api.example.com
        run: docker compose -f infra/compose.yaml -f infra/compose.https.yaml config --quiet
      - name: Validate custom-port TLS Compose configuration
        env:
          CAMPUS_DOMAIN: api.example.com
          CAMPUS_CERT_DIR: /etc/letsencrypt
        run: docker compose -f infra/compose.yaml -f infra/compose.tls.yaml config --quiet
      - name: Build and start container
        run: docker compose -f infra/compose.yaml up -d --build --wait --wait-timeout 120
      - name: Verify deployed API
        run: python scripts/check-backend-deployment.py http://127.0.0.1:8000
      - name: Container logs
        if: always()
        run: docker compose -f infra/compose.yaml logs --no-color --tail 100
      - name: Stop test container
        if: always()
        run: docker compose -f infra/compose.yaml down
