name: Sync release notes

on:
  push:
    branches: [main]
    paths: ['.github/release-notes.md', '.github/workflows/release-notes.yml']
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update current release notes
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' mobile/pubspec.yaml)"
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$COMPLETED_TAG" != "$TAG" ]; then
            echo 'Completed build belongs to an older version; skipping.'
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file .github/release-notes.md
          else
            echo 'Release is not published yet; notes will sync after its build completes.'
          fi
      - name: Remove backend addresses from previous release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile

          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', '--slurp', f'repos/{repo}/releases'
          ]))
          pattern = re.compile(r'https?://v4\.yukifn\.xyz(?::\d+)?(?:/[^\s<>`，。；、)]*)?', re.I)
          for release in (item for page in pages for item in page):
              body = release.get('body') or ''
              cleaned = pattern.sub('应用服务', body)
              if cleaned == body:
                  continue
              with tempfile.NamedTemporaryFile(mode='w+', encoding='utf-8') as payload:
                  json.dump({'body': cleaned}, payload, ensure_ascii=False)
                  payload.flush()
                  subprocess.run([
                      'gh', 'api', '--method', 'PATCH',
                      f"repos/{repo}/releases/{release['id']}",
                      '--input', payload.name, '--silent'
                  ], check=True)
              print(f"Cleaned release notes: {release['tag_name']}")
          PY
